[project]
name = "warden"
version = "0.1.0"
description = "Per-consumer API keys for Quorum services: grant model, server dependency and access log, calling client, and a CLI over a SOPS file synced to Vault."
requires-python = ">=3.13"
dependencies = ["pyyaml==6.0.3"]

[project.optional-dependencies]
# The service side (ServiceAuth, install, enforce): warden.fastapi.
server = ["fastapi==0.162.0"]
# The calling side (WardenAuth): warden.client. Never pulls in FastAPI.
client = ["httpx==0.28.1"]

[project.scripts]
warden = "warden.cli:main"

[dependency-groups]
dev = ["fastapi==0.162.0", "httpx==0.28.1", "pytest==9.2.0", "ruff==0.17.3", "mypy==1.20.2", "types-pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF", "SIM", "PL", "PT"]
ignore = ["PLR0913", "PLR2004", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
# sops and vault are run by name from PATH, with fixed arguments and no shell.
"src/warden/sops.py" = ["S603", "S607"]
"src/warden/vault.py" = ["S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
