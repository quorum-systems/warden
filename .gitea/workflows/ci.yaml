# Lint, types, tests on every PR and push; a `v*` tag also builds the wheel and publishes it to the Gitea PyPI
# registry of the public org quorum-actions, so CI jobs and image builds install it with no token in the build.
# Nothing confidential is in this package. Secrets: PACKAGE_REGISTRY_TOKEN (package write),
# PACKAGE_REGISTRY_USERNAME optional (default quorum-ci).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: 0.13.7
          enable-cache: true
      - name: sops and age (the CLI tests run the real binaries)
        env:
          SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  # sops-v3.13.3.checksums.txt; amd64 runners (ubuntu-24.04 label, x86 per bowdler CI)
        run: |
          SUDO=$(command -v sudo || true)
          curl -fsSLo sops https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          echo "${SOPS_SHA256}  sops" | sha256sum -c -
          $SUDO install -m 0755 sops /usr/local/bin/sops
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq age
      - run: uv sync --frozen
      - run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest -q
      - name: Each extra installs and imports on its own (a client must never pull in FastAPI)
        run: |
          set -eu
          uv build -q -o dist
          wheel="$(ls dist/*.whl)"
          for pair in client:client:fastapi server:fastapi:httpx; do
            extra="${pair%%:*}"; rest="${pair#*:}"; module="${rest%%:*}"; absent="${rest#*:}"
            uv venv -q "/tmp/x-${extra}"
            VIRTUAL_ENV="/tmp/x-${extra}" uv pip install -q "${wheel}[${extra}]"
            "/tmp/x-${extra}/bin/python" -I -c "import sys, warden.${module}; assert '${absent}' not in sys.modules, '${extra} pulled in ${absent}'"
          done
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          UV_PUBLISH_USERNAME: ${{ secrets.PACKAGE_REGISTRY_USERNAME || 'quorum-ci' }}
          UV_PUBLISH_PASSWORD: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}
        run: |
          test "v$(uv version --short)" = "${GITHUB_REF_NAME}"
          uv build
          uv publish --publish-url https://gitea.ops.quorumsystems.io/api/packages/quorum-actions/pypi
